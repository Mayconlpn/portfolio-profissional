services:
- type: web
  name: portfolio-maycon
  runtime: python
  plan: free
  region: virginia
  branch: main
  buildCommand: python -m zipfile -e portfolio_profissional_render.zip . && cd portfolio_backend
    && bash build.sh
  startCommand: cd portfolio_backend && bash start.sh
  healthCheckPath: /health/
  autoDeployTrigger: commit
  envVars:
  - key: SECRET_KEY
    generateValue: true
  - key: DEBUG
    value: 'False'
  - key: DATABASE_URL
    fromDatabase:
      name: portfolio-maycon-db
      property: connectionString
  - key: SECURE_SSL_REDIRECT
    value: 'True'
  - key: TRUST_PROXY_SSL_HEADER
    value: 'True'
  - key: SECURE_HSTS_SECONDS
    value: '31536000'
  - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
    value: 'True'
  - key: SECURE_HSTS_PRELOAD
    value: 'True'
  - key: DJANGO_SUPERUSER_USERNAME
    value: admin
  - key: DJANGO_SUPERUSER_PASSWORD
    sync: false
databases:
- name: portfolio-maycon-db
  plan: free
  region: virginia
  databaseName: portfolio
  user: portfolio
  ipAllowList: []
